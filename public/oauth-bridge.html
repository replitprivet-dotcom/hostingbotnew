<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaalix Cloud - Secure Google Sign-In Bridge</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #f8fafd;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.5rem;
      padding: 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #2563eb, #6366f1, #06b6d4);
    }
    .icon-box {
      width: 56px;
      height: 56px;
      border-radius: 1rem;
      background: #eff6ff;
      border: 1px solid #dbeafe;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      color: #0b57d0;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.8125rem;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #dbeafe;
      border-top-color: #0b57d0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 1rem auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.75rem 1rem;
      background: #0b57d0;
      color: #ffffff;
      border: none;
      border-radius: 0.875rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      margin-top: 0.5rem;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .token-box {
      display: none;
      margin-top: 1.25rem;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 0.75rem;
      padding: 0.75rem;
      text-align: left;
    }
    .token-label {
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #475569;
      margin-bottom: 0.35rem;
    }
    .token-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      word-break: break-all;
      color: #0f172a;
      max-height: 80px;
      overflow-y: auto;
      user-select: all;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.625rem;
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
      border-radius: 9999px;
      font-size: 0.6875rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    .status-alert {
      padding: 0.75rem;
      border-radius: 0.75rem;
      font-size: 0.75rem;
      margin-bottom: 1rem;
      text-align: left;
      display: none;
    }
    .status-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }
    .status-success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar"></div>

    <div class="icon-box">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
      </svg>
    </div>

    <div id="statusBadge" class="badge">SECURE OAUTH BRIDGE</div>

    <h1 id="titleText">Connecting to Google...</h1>
    <p id="descText">Authenticating your Google Drive account with Kaalix Cloud without origin restriction.</p>

    <div id="alertBox" class="status-alert"></div>

    <div id="loadingSpinner" class="spinner"></div>

    <button id="manualAuthBtn" class="btn" style="display: none;" onclick="startAuth()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Select Google Account
    </button>

    <div id="tokenSection" class="token-box">
      <div class="token-label">Access Token Granted:</div>
      <div id="tokenText" class="token-text"></div>
      <button class="btn btn-secondary" onclick="copyToken()">Copy Token & Return</button>
    </div>
  </div>

  <script>
    const DEFAULT_CLIENT_ID = '148790012602-i9ihrib4m7pb7qj6qtqnaria3goq4sob.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive';

    const urlParams = new URLSearchParams(window.location.search);
    const callerOrigin = urlParams.get('origin') || '*';
    const clientId = urlParams.get('client_id') || DEFAULT_CLIENT_ID;
    const forceSelect = urlParams.get('select_account') === 'true';

    let tokenClient = null;
    let authAttempts = 0;

    function showAlert(msg, isError = true) {
      const el = document.getElementById('alertBox');
      el.style.display = 'block';
      el.className = isError ? 'status-alert status-error' : 'status-alert status-success';
      el.textContent = msg;
    }

    function initGIS() {
      if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
        if (authAttempts < 20) {
          authAttempts++;
          setTimeout(initGIS, 250);
          return;
        }
        showAlert('Google Identity Services failed to load. Please check your internet connection.');
        document.getElementById('loadingSpinner').style.display = 'none';
        return;
      }

      try {
        tokenClient = window.google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: SCOPES,
          callback: (response) => {
            document.getElementById('loadingSpinner').style.display = 'none';
            if (response.error) {
              showAlert('Google Auth Error: ' + response.error);
              document.getElementById('manualAuthBtn').style.display = 'inline-flex';
              return;
            }

            if (response.access_token) {
              handleTokenReceived(response.access_token);
            } else {
              showAlert('No access token received.');
              document.getElementById('manualAuthBtn').style.display = 'inline-flex';
            }
          }
        });

        // Trigger account selection prompt automatically
        startAuth();
      } catch (err) {
        showAlert('Init Error: ' + err.message);
        document.getElementById('loadingSpinner').style.display = 'none';
        document.getElementById('manualAuthBtn').style.display = 'inline-flex';
      }
    }

    function startAuth() {
      if (!tokenClient) {
        initGIS();
        return;
      }
      document.getElementById('loadingSpinner').style.display = 'block';
      document.getElementById('manualAuthBtn').style.display = 'none';
      tokenClient.requestAccessToken({ prompt: forceSelect ? 'select_account' : 'consent' });
    }

    function handleTokenReceived(token) {
      document.getElementById('titleText').textContent = 'Successfully Authenticated!';
      document.getElementById('descText').textContent = 'Transferring secure credentials back to your Kaalix Cloud window...';
      document.getElementById('statusBadge').textContent = 'CONNECTED';
      document.getElementById('statusBadge').style.background = '#dcfce7';
      document.getElementById('statusBadge').style.color = '#15803d';

      // Send to opener window
      let openerNotified = false;
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({
            type: 'KAALIX_OAUTH_TOKEN',
            token: token
          }, '*');
          openerNotified = true;
        } catch (e) {
          console.warn('postMessage error:', e);
        }
      }

      // Also try parent in case embedded in iframe
      if (window.parent && window.parent !== window) {
        try {
          window.parent.postMessage({
            type: 'KAALIX_OAUTH_TOKEN',
            token: token
          }, '*');
          openerNotified = true;
        } catch (e) {}
      }

      if (openerNotified) {
        setTimeout(() => {
          window.close();
        }, 800);
      } else {
        // Fallback for popup blocker / separate tab: Display token to copy
        document.getElementById('tokenSection').style.display = 'block';
        document.getElementById('tokenText').textContent = token;
      }
    }

    function copyToken() {
      const text = document.getElementById('tokenText').textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert('Access Token copied to clipboard! Paste it into the Kaalix Cloud login dialog.');
        window.close();
      });
    }

    window.addEventListener('load', () => {
      setTimeout(initGIS, 300);
    });
  </script>
</body>
</html>
